<!DOCTYPE html>
<html lang="fa" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حسـین پ.</title>
    <meta name="description" content="وب‌سایت شخصی حسـین پ. - نمونه کارها، رزومه و اطلاعات تماس">
    <meta name="theme-color" content="#0d6efd">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --primary: #0d6efd;
            --primary-hover: #0b5ed7;
            --bg: #ffffff;
            --surface: #f8f9fa;
            --card: #ffffff;
            --text: #212529;
            --text-secondary: #6c757d;
            --border: #dee2e6;
            --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --radius: 16px;
            --transition: 0.3s ease;
            --footer-bg: #f1f3f5;
            --overlay-bg: rgba(0,0,0,0.5);
            --drawer-bg: #ffffff;
            --nav-bg: rgba(255,255,255,0.85);
            --nav-border: rgba(0,0,0,0.1);
            --orb-opacity: 0.15;
        }
        .dark {
            --bg: #121212;
            --surface: #1e1e1e;
            --card: #1e1e1e;
            --text: #e0e0e0;
            --text-secondary: #a0a0a0;
            --border: #333333;
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --footer-bg: #181818;
            --drawer-bg: #1e1e1e;
            --nav-bg: rgba(30,30,30,0.9);
            --nav-border: rgba(255,255,255,0.1);
            --overlay-bg: rgba(0,0,0,0.7);
            --orb-opacity: 0.08;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: background-color var(--transition), color var(--transition);
            direction: rtl;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        [dir="ltr"] body {
            direction: ltr;
        }
        /* Background animated orbs */
        .bg-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: var(--orb-opacity);
            animation: float 20s infinite ease-in-out;
        }
        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 350px;
            height: 350px;
            background: #e91e63;
            bottom: -120px;
            right: -100px;
            animation-delay: -7s;
            animation-duration: 25s;
        }
        .orb-3 {
            width: 300px;
            height: 300px;
            background: #ffc107;
            top: 50%;
            left: 60%;
            animation-delay: -14s;
            animation-duration: 30s;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -60px) scale(1.1); }
            50% { transform: translate(-30px, 80px) scale(0.9); }
            75% { transform: translate(-70px, -30px) scale(1.05); }
        }
        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: var(--overlay-bg);
            z-index: 90;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s, visibility 0.3s;
        }
        .overlay.active {
            opacity: 1;
            visibility: visible;
        }
        /* Drawer */
        .drawer {
            position: fixed;
            top: 0;
            height: 100%;
            width: 280px;
            background: var(--drawer-bg);
            box-shadow: var(--shadow);
            z-index: 100;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            overflow-y: auto;
        }
        [dir="ltr"] .drawer {
            left: 0;
            transform: translateX(-100%);
        }
        [dir="rtl"] .drawer {
            right: 0;
            transform: translateX(100%);
        }
        .drawer.open {
            transform: translateX(0);
        }
        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .drawer-title {
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--primary);
        }
        .drawer-close {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 0.3rem;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .drawer-close:hover {
            background: var(--border);
        }
        .drawer-nav {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex: 1;
        }
        .drawer-nav li a {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }
        .drawer-nav li a:hover,
        .drawer-nav li a.active {
            background: var(--primary);
            color: #fff;
        }
        .drawer-footer-text {
            margin-top: auto;
            padding-top: 1rem;
            font-size: 0.7rem;
            color: var(--text-secondary);
            opacity: 0.5;
            text-align: center;
        }
        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--nav-border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .hamburger {
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 0.4rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hamburger:hover {
            background: var(--border);
        }
        .header-title {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--primary);
        }
        /* Main content */
        .main-content {
            flex: 1;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
        }
        .page {
            display: none;
            flex: 1;
            padding: 2rem 1rem;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Home page */
        .hero {
            text-align: center;
        }
        .hero-title {
            font-size: clamp(2.5rem, 10vw, 5rem);
            font-weight: 700;
            color: var(--primary);
            min-height: 1.2em;
        }
        .typed-cursor {
            font-weight: 300;
            color: var(--primary);
        }
        /* Settings page */
        .settings-container {
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }
        .settings-section {
            margin-bottom: 2rem;
        }
        .settings-label {
            font-weight: 600;
            margin-bottom: 0.8rem;
            display: block;
            color: var(--text);
        }
        .theme-options, .lang-options {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .option-btn {
            position: relative;
        }
        .option-btn input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }
        .option-btn label {
            display: block;
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            background: var(--surface);
            color: var(--text);
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            user-select: none;
        }
        .option-btn input:checked + label {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .palette-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .color-swatch {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
            background: var(--swatch-color);
        }
        .color-swatch.selected {
            border-color: var(--text);
            transform: scale(1.15);
            box-shadow: 0 0 0 3px var(--primary);
        }
        .version-line {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: var(--text-secondary);
            opacity: 0.4;
            text-align: center;
            min-height: 1em;
        }
        /* Links page */
        .coming-soon-wrapper {
            font-size: 2.5rem;
            font-weight: 600;
            color: var(--text);
            opacity: 0.8;
        }
        /* Footer */
        .footer {
            background: var(--footer-bg);
            border-top: 1px solid var(--border);
            padding: 1rem 1.5rem;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            z-index: 1;
            position: relative;
        }
        .footer-content {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }
        .gmail-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .gmail-link:hover {
            text-decoration: underline;
        }
        /* Bottom navigation */
        .bottom-nav {
            position: sticky;
            bottom: 0;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--nav-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0.4rem 0.5rem;
            z-index: 50;
        }
        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.15rem;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.4rem 0.8rem;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.7rem;
            font-weight: 500;
            transition: color 0.2s, background 0.2s;
            min-width: 64px;
        }
        .bottom-nav-item i {
            font-size: 1.4rem;
        }
        .bottom-nav-item.active {
            color: var(--primary);
            background: rgba(13,110,253,0.1);
        }
        @media (max-width: 480px) {
            .settings-container { padding: 1.5rem; }
            .hero-title { font-size: 2.8rem; }
        }
    </style>
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="overlay" id="overlay"></div>

    <aside class="drawer" id="drawer">
        <div class="drawer-header">
            <span class="drawer-title">حسـین پ.</span>
            <button class="drawer-close" id="drawerClose" aria-label="بستن منو">
                <i class="material-icons">close</i>
            </button>
        </div>
        <ul class="drawer-nav" id="drawerNav">
            <li><a href="#home" data-page="home" class="active"><i class="material-icons">home</i> <span data-i18n="home">صفحه اصلی</span></a></li>
            <li><a href="#settings" data-page="settings"><i class="material-icons">settings</i> <span data-i18n="settings">تنظیمات</span></a></li>
            <li><a href="#links" data-page="links"><i class="material-icons">link</i> <span data-i18n="links">لینک‌ها</span></a></li>
        </ul>
        <div class="drawer-footer-text"><span data-i18n="versionLabel">نسخه</span> v1.0.0</div>
    </aside>

    <header class="header">
        <button class="hamburger" id="hamburgerBtn" aria-label="منو">
            <i class="material-icons">menu</i>
        </button>
        <span class="header-title">حسـین پ.</span>
        <div style="width:40px;"></div> <!-- spacer -->
    </header>

    <main class="main-content">
        <section class="page active" id="page-home">
            <div class="hero">
                <h1 class="hero-title"><span id="main-typed"></span></h1>
            </div>
        </section>

        <section class="page" id="page-settings">
            <div class="settings-container">
                <div class="settings-section">
                    <span class="settings-label" data-i18n="theme">حالت سایت</span>
                    <div class="theme-options" id="themeOptions">
                        <div class="option-btn">
                            <input type="radio" name="theme" id="themeLight" value="light">
                            <label for="themeLight" data-i18n="light">روشن</label>
                        </div>
                        <div class="option-btn">
                            <input type="radio" name="theme" id="themeDark" value="dark">
                            <label for="themeDark" data-i18n="dark">تیره</label>
                        </div>
                        <div class="option-btn">
                            <input type="radio" name="theme" id="themeSystem" value="system">
                            <label for="themeSystem" data-i18n="system">مطابق سیستم</label>
                        </div>
                    </div>
                </div>

                <div class="settings-section">
                    <span class="settings-label" data-i18n="palette">پالت رنگی</span>
                    <div class="palette-grid" id="paletteGrid"></div>
                </div>

                <div class="settings-section">
                    <span class="settings-label" data-i18n="language">زبان</span>
                    <div class="lang-options" id="langOptions">
                        <div class="option-btn">
                            <input type="radio" name="lang" id="langFa" value="fa">
                            <label for="langFa">فارسی</label>
                        </div>
                        <div class="option-btn">
                            <input type="radio" name="lang" id="langEn" value="en">
                            <label for="langEn">English</label>
                        </div>
                        <div class="option-btn">
                            <input type="radio" name="lang" id="langAr" value="ar">
                            <label for="langAr">العربية</label>
                        </div>
                    </div>
                </div>

                <div class="version-line" id="versionContainer">
                    <span id="versionTyped"></span>
                </div>
            </div>
        </section>

        <section class="page" id="page-links">
            <div class="coming-soon-wrapper">
                <span id="comingSoonTyped"></span>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-content">
            <span data-i18n="footerRights">تمامی حقوق برای حسـین پ. محفوظ است! ©</span>
            <a href="mailto:Hossein.P.2013.1391@gmail.com" class="gmail-link">
                <i class="material-icons" style="font-size:1rem;">mail</i> Gmail
            </a>
        </div>
    </footer>

    <nav class="bottom-nav" id="bottomNav">
        <button class="bottom-nav-item active" data-page="home">
            <i class="material-icons">home</i>
            <span data-i18n="home">صفحه اصلی</span>
        </button>
        <button class="bottom-nav-item" data-page="settings">
            <i class="material-icons">settings</i>
            <span data-i18n="settings">تنظیمات</span>
        </button>
        <button class="bottom-nav-item" data-page="links">
            <i class="material-icons">link</i>
            <span data-i18n="links">لینک‌ها</span>
        </button>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/typed.js@2.0.12"></script>
    <script>
        (function() {
            // --- TRANSLATIONS ---
            const translations = {
                fa: {
                    home: 'صفحه اصلی',
                    settings: 'تنظیمات',
                    links: 'لینک‌ها',
                    theme: 'حالت سایت',
                    light: 'روشن',
                    dark: 'تیره',
                    system: 'مطابق سیستم',
                    palette: 'پالت رنگی',
                    language: 'زبان',
                    comingSoon: 'بـه‌زودی...',
                    versionLabel: 'نسخه',
                    footerRights: 'تمامی حقوق برای حسـین پ. محفوظ است! ©',
                },
                en: {
                    home: 'Home',
                    settings: 'Settings',
                    links: 'Links',
                    theme: 'Site Theme',
                    light: 'Light',
                    dark: 'Dark',
                    system: 'System',
                    palette: 'Color Palette',
                    language: 'Language',
                    comingSoon: 'Coming soon...',
                    versionLabel: 'Version',
                    footerRights: 'All rights reserved for Hossein P. ©',
                },
                ar: {
                    home: 'الصفحة الرئيسية',
                    settings: 'الإعدادات',
                    links: 'الروابط',
                    theme: 'وضع الموقع',
                    light: 'فاتح',
                    dark: 'داكن',
                    system: 'النظام',
                    palette: 'لوحة الألوان',
                    language: 'اللغة',
                    comingSoon: 'قريباً...',
                    versionLabel: 'إصدار',
                    footerRights: 'جميع الحقوق محفوظة لحسين ب. ©',
                }
            };

            const PALETTE_COLORS = [
                '#f44336','#e91e63','#9c27b0','#673ab7','#3f51b5',
                '#0d6efd','#03a9f4','#00bcd4','#009688','#4caf50',
                '#8bc34a','#cddc39','#ffc107','#ff9800','#ff5722',
                '#795548','#9e9e9e','#607d8b','#000000','#ffffff'
            ];

            const DEFAULT_PALETTE = '#0d6efd';
            const DEFAULT_THEME = 'light';
            const DEFAULT_LANG = 'fa';

            // --- STATE ---
            let currentPage = 'home';
            let themeMode = DEFAULT_THEME;
            let selectedColor = DEFAULT_PALETTE;
            let currentLang = DEFAULT_LANG;

            // --- DOM ELEMENTS ---
            const html = document.documentElement;
            const overlay = document.getElementById('overlay');
            const drawer = document.getElementById('drawer');
            const drawerClose = document.getElementById('drawerClose');
            const hamburgerBtn = document.getElementById('hamburgerBtn');
            const drawerNav = document.getElementById('drawerNav');
            const bottomNav = document.getElementById('bottomNav');
            const pages = {
                home: document.getElementById('page-home'),
                settings: document.getElementById('page-settings'),
                links: document.getElementById('page-links'),
            };
            const mainTypedEl = document.getElementById('main-typed');
            const versionTypedEl = document.getElementById('versionTyped');
            const comingSoonTypedEl = document.getElementById('comingSoonTyped');
            const versionContainer = document.getElementById('versionContainer');
            const paletteGrid = document.getElementById('paletteGrid');
            const themeRadios = document.querySelectorAll('input[name="theme"]');
            const langRadios = document.querySelectorAll('input[name="lang"]');

            // --- LOCAL STORAGE KEYS ---
            const STORAGE_THEME = 'hosseinp_theme';
            const STORAGE_COLOR = 'hosseinp_color';
            const STORAGE_LANG = 'hosseinp_lang';
            const STORAGE_VERSION_TYPED = 'hosseinp_versionTyped';
            const STORAGE_COMING_TYPED = 'hosseinp_comingTyped';

            // --- APPLY THEME ---
            function applyTheme(mode) {
                html.classList.remove('light', 'dark');
                if (mode === 'system') {
                    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    html.classList.add(prefersDark ? 'dark' : 'light');
                } else {
                    html.classList.add(mode);
                }
                // update radio
                themeRadios.forEach(r => r.checked = (r.value === mode));
            }

            function handleSystemThemeChange(e) {
                if (themeMode === 'system') {
                    html.classList.remove('light', 'dark');
                    html.classList.add(e.matches ? 'dark' : 'light');
                }
            }

            // --- APPLY COLOR ---
            function applyColor(color) {
                html.style.setProperty('--primary', color);
                // derive hover slightly darker
                html.style.setProperty('--primary-hover', adjustBrightness(color, -20));
                selectedColor = color;
                // update swatches
                document.querySelectorAll('.color-swatch').forEach(sw => {
                    sw.classList.toggle('selected', sw.dataset.color === color);
                });
            }

            function adjustBrightness(hex, percent) {
                // simple darken
                let R, G, B;
                if (hex.length === 7) {
                    R = parseInt(hex.substring(1,3), 16);
                    G = parseInt(hex.substring(3,5), 16);
                    B = parseInt(hex.substring(5,7), 16);
                } else return hex;
                R = Math.max(0, R + percent);
                G = Math.max(0, G + percent);
                B = Math.max(0, B + percent);
                return `#${((1<<24) + (R<<16) + (G<<8) + B).toString(16).slice(1)}`;
            }

            // --- APPLY LANGUAGE ---
            function applyLanguage(lang) {
                currentLang = lang;
                html.lang = lang;
                html.dir = (lang === 'en') ? 'ltr' : 'rtl';
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.dataset.i18n;
                    if (translations[lang] && translations[lang][key]) {
                        el.textContent = translations[lang][key];
                    }
                });
                // update radio
                langRadios.forEach(r => r.checked = (r.value === lang));
                // update version text if already typed
                if (localStorage.getItem(STORAGE_VERSION_TYPED) === 'true') {
                    versionTypedEl.textContent = translations[lang].versionLabel + ' v1.0.0';
                }
                if (localStorage.getItem(STORAGE_COMING_TYPED) === 'true') {
                    comingSoonTypedEl.textContent = translations[lang].comingSoon;
                }
            }

            // --- NAVIGATION ---
            function navigateTo(pageName) {
                if (currentPage === pageName) return;
                currentPage = pageName;
                // update pages visibility
                Object.keys(pages).forEach(key => {
                    pages[key].classList.toggle('active', key === pageName);
                });
                // update drawer links
                drawerNav.querySelectorAll('a').forEach(a => {
                    a.classList.toggle('active', a.dataset.page === pageName);
                });
                // update bottom nav
                bottomNav.querySelectorAll('.bottom-nav-item').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.page === pageName);
                });
                // update URL hash
                window.location.hash = pageName;
                // close drawer
                closeDrawer();
                // handle typing effects on page show
                if (pageName === 'settings') {
                    handleVersionTyping();
                } else if (pageName === 'links') {
                    handleComingSoonTyping();
                }
            }

            // --- DRAWER ---
            function openDrawer() {
                drawer.classList.add('open');
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
            function closeDrawer() {
                drawer.classList.remove('open');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            // --- TYPING EFFECTS ---
            let mainTypedInstance = null;
            function initMainTyping() {
                if (mainTypedInstance) mainTypedInstance.destroy();
                mainTypedEl.textContent = '';
                mainTypedInstance = new Typed('#main-typed', {
                    strings: ['حسـین پ.'],
                    typeSpeed: 80,
                    startDelay: 300,
                    showCursor: true,
                    cursorChar: '|',
                    onComplete: () => {
                        // keep cursor blinking a bit then remove? leave it.
                    }
                });
            }

            function handleVersionTyping() {
                const alreadyTyped = localStorage.getItem(STORAGE_VERSION_TYPED) === 'true';
                const versionStr = translations[currentLang].versionLabel + ' v1.0.0';
                if (alreadyTyped) {
                    versionTypedEl.textContent = versionStr;
                } else {
                    versionTypedEl.textContent = '';
                    new Typed('#versionTyped', {
                        strings: [versionStr],
                        typeSpeed: 60,
                        startDelay: 200,
                        showCursor: false,
                        onComplete: () => {
                            localStorage.setItem(STORAGE_VERSION_TYPED, 'true');
                        }
                    });
                }
            }

            function handleComingSoonTyping() {
                const alreadyTyped = localStorage.getItem(STORAGE_COMING_TYPED) === 'true';
                const text = translations[currentLang].comingSoon;
                if (alreadyTyped) {
                    comingSoonTypedEl.textContent = text;
                } else {
                    comingSoonTypedEl.textContent = '';
                    new Typed('#comingSoonTyped', {
                        strings: [text],
                        typeSpeed: 70,
                        startDelay: 200,
                        showCursor: false,
                        onComplete: () => {
                            localStorage.setItem(STORAGE_COMING_TYPED, 'true');
                        }
                    });
                }
            }

            // --- BUILD PALETTE ---
            function buildPalette() {
                paletteGrid.innerHTML = '';
                PALETTE_COLORS.forEach(color => {
                    const swatch = document.createElement('div');
                    swatch.className = 'color-swatch';
                    swatch.style.setProperty('--swatch-color', color);
                    swatch.dataset.color = color;
                    if (color === selectedColor) swatch.classList.add('selected');
                    swatch.addEventListener('click', () => {
                        applyColor(color);
                        localStorage.setItem(STORAGE_COLOR, color);
                    });
                    paletteGrid.appendChild(swatch);
                });
            }

            // --- INITIAL SETUP ---
            function loadStoredSettings() {
                themeMode = localStorage.getItem(STORAGE_THEME) || DEFAULT_THEME;
                selectedColor = localStorage.getItem(STORAGE_COLOR) || DEFAULT_PALETTE;
                currentLang = localStorage.getItem(STORAGE_LANG) || DEFAULT_LANG;
                applyTheme(themeMode);
                applyColor(selectedColor);
                applyLanguage(currentLang);
                buildPalette();
            }

            function setupEventListeners() {
                // Drawer
                hamburgerBtn.addEventListener('click', openDrawer);
                drawerClose.addEventListener('click', closeDrawer);
                overlay.addEventListener('click', closeDrawer);

                // Drawer navigation
                drawerNav.addEventListener('click', (e) => {
                    const link = e.target.closest('a');
                    if (link && link.dataset.page) {
                        e.preventDefault();
                        navigateTo(link.dataset.page);
                    }
                });

                // Bottom navigation
                bottomNav.addEventListener('click', (e) => {
                    const btn = e.target.closest('.bottom-nav-item');
                    if (btn && btn.dataset.page) {
                        navigateTo(btn.dataset.page);
                    }
                });

                // Theme radios
                themeRadios.forEach(radio => {
                    radio.addEventListener('change', (e) => {
                        if (e.target.checked) {
                            themeMode = e.target.value;
                            applyTheme(themeMode);
                            localStorage.setItem(STORAGE_THEME, themeMode);
                        }
                    });
                });

                // Language radios
                langRadios.forEach(radio => {
                    radio.addEventListener('change', (e) => {
                        if (e.target.checked) {
                            applyLanguage(e.target.value);
                            localStorage.setItem(STORAGE_LANG, e.target.value);
                        }
                    });
                });

                // System theme listener
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', handleSystemThemeChange);
            }

            function handleInitialHash() {
                const hash = window.location.hash.substring(1);
                if (hash && pages[hash]) {
                    navigateTo(hash);
                } else {
                    navigateTo('home');
                }
            }

            // --- START ---
            loadStoredSettings();
            setupEventListeners();
            initMainTyping();
            handleInitialHash();

            // If initial page is settings, ensure version typing triggered
            if (currentPage === 'settings') handleVersionTyping();
            if (currentPage === 'links') handleComingSoonTyping();

            window.addEventListener('hashchange', () => {
                const hash = window.location.hash.substring(1);
                if (hash && pages[hash]) {
                    navigateTo(hash);
                }
            });

        })();
    </script>
</body>
  </html>
